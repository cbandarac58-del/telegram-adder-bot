name: Auto Discover and Forwarder

on:
  schedule:
    # දවසට වාර 4කට වරක් ස්වයංක්‍රීයව රන් වේ
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-forwarder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install telethon

      - name: Run Forwarder Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
        run: |
          python auto_discover_external.py

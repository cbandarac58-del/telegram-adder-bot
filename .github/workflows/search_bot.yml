name: Telegram Search Bot 24x7

on:
  schedule:
    # සෑම මිනිත්තු 30කට වරක්ම ස්ක්‍රිප්ට් එක ඔටෝ රන් වෙලා බෝට් එක ලයිව් තබා ගනී
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot requests

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          # බෝට් එක මිනිත්තු 25ක් (තත්පර 1500ක්) අඛණ්ඩව රන් වේ
          timeout 1500 python search_bot.py || true

name: Gold Sniper V4.0 Cloud Bot (88% Win-Rate)

on:
  schedule:
    # Runs automatically every 15 minutes during London & NY Killzone (Monday-Friday, 07:00 - 18:45 UTC = 12:30 PM - 12:15 AM SL Time)
    - cron: '2,17,32,47 7-18 * * 1-5'

  workflow_dispatch:

jobs:
  scan_gold_market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -q yfinance pandas numpy scikit-learn requests telethon

      - name: Run V4.0 Sniper Engine & Send Telegram Alert
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          ACCOUNT_BALANCE: '500'
          RISK_PERCENT: '1.5'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python sniper_bot.py

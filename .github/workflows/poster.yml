name: Telegram Auto Poster - 5 Movies Daily

on:
  schedule:
    # Runs daily at 04:00 UTC (9:30 AM Sri Lanka time)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run poster bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python poster_bot.py
      
      - name: Commit posted_movies.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch posted_movies.txt
          git add posted_movies.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted movies [skip ci]"
          git push || true
name: Telegram Auto Poster - 12 Posts Daily (7 Movies, 5 TV Series)

on:
  schedule:
    # Runs every 2 hours: 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC
    # Exactly 12 posts per day: 7 Movies & 5 TV Series
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run poster bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python poster_bot.py
      
      - name: Commit posted_movies.txt and daily_tracker.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch posted_movies.txt daily_tracker.json
          git add posted_movies.txt daily_tracker.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted content history & quota [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true

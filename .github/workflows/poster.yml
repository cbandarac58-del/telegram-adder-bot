name: Telegram Auto Poster - 12 Posts Daily (7 Movies, 5 TV Series)

on:
  schedule:
    # Runs every 2 hours at minute 17 to avoid GitHub Actions minute 0 queue congestion:
    # 00:17, 02:17, 04:17, 06:17, 08:17, 10:17, 12:17, 14:17, 16:17, 18:17, 20:17, 22:17 UTC
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run poster bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python poster_bot.py
      
      - name: Commit posted_movies.txt and daily_tracker.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch posted_movies.txt daily_tracker.json
          git add posted_movies.txt daily_tracker.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted content history & quota [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
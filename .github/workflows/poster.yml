name: Telegram Auto Poster - 5 Movies Daily

on:
  schedule:
    # හැම 4 පැයකට වරක් run වෙනවා (දවසට 6 වතාවක්)
    # ඒත් script එකේ POSTS_PER_DAY = 5 නිසා දවසට 5ක් විතරයි post වෙන්නේ
    - cron: '0 */4 * * *'
  workflow_dispatch:  # manual run කරන්නත් පුළුවන්

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run poster bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python poster_bot.py
      
      - name: Commit posted_movies.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_movies.txt || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted movies"
          git push || true
